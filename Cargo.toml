[package]
name = "lomo"
version = "0.1.0"
edition = "2021"
description = "Low Overhead Markdown Overwatch — view and annotate an agent-owned TODO.md"
authors = ["John Anthony Mariquit <john@mariquit.com>"]
license = "MIT"
readme = "README.md"

[[bin]]
name = "lomo"
path = "src/main.rs"

[dependencies]
crossterm = "0.28"
notify = "6.1"
ratatui = "0.29"
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
